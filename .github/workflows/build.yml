          cd src
          git apply --verbose ../neo.patch

      - name: Nastavit Javu 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runnery uz maji Android SDK predinstalovane (ANDROID_HOME
      # je nastavene). Externi akci setup-android nepotrebujeme - je
      # dlouhodobe neudrzovana a casto padala. Jen doinstalujeme
      # konkretni platformu a build-tools, ktere projekt potrebuje.
      - name: Doinstalovat SDK platformu
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Sestavit APK
        run: |
          cd src/Launcher
          chmod +x ./gradlew
          ./gradlew assembleSideloadDebug --stacktrace --no-daemon

      - name: Nahrat APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Neo-Launcher-APK
          path: src/Launcher/App/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Nahrat logy pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: src/Launcher/App/build/reports/**
          if-no-files-found: ignore

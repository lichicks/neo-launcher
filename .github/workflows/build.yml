name: Build Neo Launcher 2.0

# Stavi novy Neo Launcher ze slozky app/. Spousti se pri kazdem pushi
# (na jakoukoliv vetev) a rucne pres "Run workflow". Hotove APK je ke
# stazeni v sekci Artifacts u konkretniho behu.
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nastavit Javu 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Ubuntu runnery maji Android SDK predinstalovane (ANDROID_HOME).
      - name: Doinstalovat SDK platformu
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Sestavit APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Pojmenovat APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/NeoLauncher-2.0-${GITHUB_SHA::7}.apk"

      - name: Nahrat APK
        uses: actions/upload-artifact@v4
        with:
          name: NeoLauncher-APK
          path: out/*.apk
          if-no-files-found: error

      - name: Nahrat logy pri chybe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/reports/**
          if-no-files-found: ignore
